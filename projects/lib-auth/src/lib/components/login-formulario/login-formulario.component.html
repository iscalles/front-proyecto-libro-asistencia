<div class="login-form-container">
  <div class="login-form-card">
    <!-- Header -->
    <div class="login-header">
      <h1 class="login-title">Acceso al Libro de Clases</h1>
      <p class="login-subtitle">Colegio Bernardo O'Higgins</p>
    </div>

    <!-- Error Alert -->
    @if (serverError) {
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Error de autenticación:</strong> {{ serverError.mensaje }}
        <button
          type="button"
          class="btn-close"
          (click)="serverError = null"
          aria-label="Cerrar"
        ></button>
      </div>
    }

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- RUT Input -->
      <app-entrada-formulario
        formControlName="rutUsuario"
        label="RUT"
        name="rutUsuario"
        type="text"
        placeholder="Ej: 12.345.678-9"
        [error]="obtenerErrorRut()"
        hint="Ingrese su RUT en formato XX.XXX.XXX-X"
        [required]="true"
        (valueChange)="onInputChange()"
      ></app-entrada-formulario>

      <!-- Password Input -->
      <app-contrasena-conmutable
        formControlName="password"
        label="Contraseña"
        name="password"
        placeholder="Ingrese su contraseña"
        [error]="obtenerErrorContrasena()"
        [required]="true"
        (valueChange)="onInputChange()"
      ></app-contrasena-conmutable>

      <!-- Submit Button -->
      <div class="button-group mt-4">
        <button
          type="submit"
          class="btn btn-primary btn-lg w-100 login-btn"
          [disabled]="estaDeshabilitadoEnvio"
        >
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Ingresando...
          } @else {
            Ingresar
          }
        </button>
      </div>

      <!-- Help Text -->
      <div class="help-text mt-4 text-center">
        <p class="text-muted small">
          ¿Problemas para ingresar?
          <a href="#" class="text-decoration-none">Contacte al administrador</a>
        </p>
      </div>
    </form>

    <!-- Footer -->
    <div class="login-footer mt-5 text-center">
      <p class="text-muted very-small">
        Sistema de Gestión - Libro de Clases Digital
        <br />
        © 2026 Colegio Bernardo O'Higgins
      </p>
    </div>
  </div>
</div>
