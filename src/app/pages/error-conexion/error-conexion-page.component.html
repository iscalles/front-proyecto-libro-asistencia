<div class="contenedor-error d-flex align-items-center justify-content-center">
  <div class="tarjeta-error text-center">
    <div class="icono-error mb-4">
      <i class="bi bi-hdd-network"></i>
    </div>

    <h1 class="titulo-error mb-2">No pudimos conectar con el servidor :(</h1>
    <p class="mensaje-error mb-4">
      Uno de los servicios del sistema no está disponible en este momento.
      Puede deberse a una mantención o a un problema temporal de conexión.
      Intenta nuevamente en unos instantes.
    </p>

    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <button type="button" class="btn btn-primary" (click)="reintentar()">
        <i class="bi bi-arrow-clockwise me-2"></i>Reintentar
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="irAlDashboard()">
        <i class="bi bi-house me-2"></i>Ir al inicio
      </button>
    </div>
  </div>
</div>
